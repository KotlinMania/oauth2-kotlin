[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
base64 = "0.1.0"
digest = "0.1.0"
getrandom = "0.1.0"
http = "0.1.3"
serde = "0.1.10"
serde-json = "0.1.1"
sha2 = "0.1.0"
thiserror = "0.2.0"
tokio = "0.1.1"
uuid = "0.1.2"
anyhow = "0.1.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
base64-kotlin = { module = "io.github.kotlinmania:base64-kotlin", version.ref = "base64" }
digest-kotlin = { module = "io.github.kotlinmania:digest-kotlin", version.ref = "digest" }
getrandom-kotlin = { module = "io.github.kotlinmania:getrandom-kotlin", version.ref = "getrandom" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serde-json" }
sha2-kotlin = { module = "io.github.kotlinmania:sha2-kotlin", version.ref = "sha2" }
thiserror-kotlin = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
tokio-kotlin = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }
uuid-kotlin = { module = "io.github.kotlinmania:uuid-kotlin", version.ref = "uuid" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }

[bundles]
oauth2-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "base64-kotlin",
  "digest-kotlin",
  "getrandom-kotlin",
  "http-kotlin",
  "serde-kotlin",
  "serde-json-kotlin",
  "sha2-kotlin",
  "thiserror-kotlin",
  "tokio-kotlin",
]
oauth2-commonTest = [
  "uuid-kotlin",
  "anyhow-kotlin",
]
